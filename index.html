<!doctype html>
<html lang="nl">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>
    Stagiair Handleiding
  </title>

  <link
    rel="stylesheet"
    href="styles.css?v=9"
  >
</head>


<body>

  <div class="app-shell">

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-row">

          <img
            class="brand-logo"
            src="images/logo.png"
            alt="HEMA logo"
          />

          <div>

            <strong class="brand-title">
              Stagiair Handleiding
            </strong>

            <span class="brand-subtitle">
              Onboarding
            </span>

          </div>

        </div>

      </div>


      <nav>

        <button
          class="nav-item active"
          data-view="home"
        >
          <span class="nav-icon">
            ⌂
          </span>

          <span class="nav-label">
            Overzicht
          </span>
        </button>


        <button
          class="nav-item"
          data-view="favorites"
        >
          <span class="nav-icon">
            ★
          </span>

          <span class="nav-label">
            Favorieten
          </span>
        </button>


        <div class="nav-section-label">
          Categorieën
        </div>


        <div id="categoryNav"></div>

      </nav>


      <div class="sidebar-footer">

        <strong>
          Veiligheid
        </strong>

        <span>
          Geen wachtwoorden in deze app.
        </span>

      </div>

    </aside>


    <div class="main-area">

      <header class="topbar">

        <div class="search-wrap">

          <input
            id="searchInput"
            type="search"
            placeholder="Zoek een procedure..."
            autocomplete="off"
          />

          <button
            id="clearSearch"
            class="hidden"
            type="button"
            aria-label="Zoekopdracht wissen"
          >
            ×
          </button>

        </div>

      </header>


      <main id="appContent">

        <!--
          De inhoud van de webapp
          wordt hier door app.js geladen.
        -->

      </main>

    </div>

  </div>


  <script src="data.js?v=7"></script>
  <script src="app.js?v=7"></script>

</body>

</html>
